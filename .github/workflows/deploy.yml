name: Build and Deploy

on:
  push: 
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TOKEN=${{ secrets.NEXT_PUBLIC_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ( github.ref == 'refs/heads/main' && github.event_name == 'push') 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.0.0

      # appleboy/ssh-action (drone-ssh) was flaking with "dial tcp ***:22: i/o timeout"
      # with no built-in retry. This replaces it with a native ssh call, a longer
      # connect timeout, and a 5-attempt retry loop, so a single dropped connection
      # doesn't fail the whole deploy.
      - name: Deploy to GCP server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "SSH attempt $attempt of $MAX_ATTEMPTS..."
            if ssh -o ConnectTimeout=20 \
                    -o ConnectionAttempts=3 \
                    -o StrictHostKeyChecking=no \
                    -o UserKnownHostsFile=/dev/null \
                    -i ~/.ssh/deploy_key \
                    "$SERVER_USER@$SERVER_HOST" \
                    "GH_PAT='$GH_PAT' GH_ACTOR='$GH_ACTOR' IMAGE='$IMAGE' bash -s" < .github/scripts/remote-deploy.sh; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "All $MAX_ATTEMPTS attempts failed to connect to $SERVER_HOST."
          exit 1
